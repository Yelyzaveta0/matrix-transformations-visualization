<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quadratic Form Visualizer</title>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.11.0/math.min.js"></script>
  <script src="script.js"></script>
</head>
<body>
  <h1>Quadratic Form Visualizer</h1>
  <div class="input-section">
    <label>Matrix A (symmetric):</label>
    <input id="a11" type="number" step="any" placeholder="a11">
    <input id="a12" type="number" step="any" placeholder="a12 = a21">
    <input id="a22" type="number" step="any" placeholder="a22">
  </div>
  <div class="transformation-section">
    <h3>Transformations:</h3>
    <div>
      <input type="checkbox" id="enable-scale" checked>
      <label>Scale Factor:</label>
      <input id="scale" type="number" step="0.1" value="1">
    </div>
    <div>
      <input type="checkbox" id="enable-rotation">
      <label>Rotation Angle (degrees):</label>
      <input id="rotation" type="number" step="1" value="0">
    </div>
    <div>
      <input type="checkbox" id="enable-shear">
      <label>Shear Factor:</label>
      <input id="shear" type="number" step="0.1" value="0">
    </div>
  </div>
  <button onclick="plotMatrix()">Graph</button>
  <div id="plot"></div>
  <link rel="stylesheet" href="style.css">
</body>
</html>
